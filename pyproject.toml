[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verigence-whatsapp"
version = "0.1.0"
description = "Verigence WhatsApp evidence-capture service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "procrastinate[sqlalchemy]>=2.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
redaction = [
    "Pillow>=10.3.0",
    "pyzbar>=0.1.9",
]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wa_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
