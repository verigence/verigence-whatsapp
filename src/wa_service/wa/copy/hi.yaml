# Verigence WhatsApp — Hindi copy

welcome: |
  Verigence Evidence Capture में आपका स्वागत है।
  कृपया अपने डील के दस्तावेज़ एक-एक करके भेजें।
  अगर हो सके तो पहले बुकिंग फ़ॉर्म भेजें।

file_received: "मिल गया। बाकी दस्तावेज़ भेजते रहें — सब एक साथ प्रोसेस होंगे।"

debounce_flushing: "धन्यवाद, आपका सबमिशन प्रोसेस हो रहा है..."

deal_confirm_header: "डील की पुष्टि करें"
deal_confirm_body: |
  आपके दस्तावेज़ों से यह डील मिली:
    बुकिंग: {booking_number}
    वाहन: {model}
    ग्राहक: {customer_name}
  क्या यह सही है?
deal_confirm_yes: "हाँ, पुष्टि करें"
deal_confirm_no: "नहीं, फिर से भेजें"

deal_confirmed: "डील की पुष्टि हो गई। दस्तावेज़ जाँचे जा रहे हैं..."

gaps_header: "सबमिशन सारांश"
gaps_complete: |
  ✅ बुकिंग {booking_number} के लिए सभी ज़रूरी दस्तावेज़ मिल गए।
  आपका सबमिशन पूरा हो गया।
gaps_missing: |
  प्राप्त दस्तावेज़:
  {received_list}

  अभी चाहिए:
  {missing_list}

  कृपया बाकी दस्तावेज़ जल्द भेजें।

retake_request: |
  यह दस्तावेज़ साफ़ नहीं था, कृपया फिर से भेजें:
  • {doc_name}
  फ़ोटो खींचते समय सभी चारों कोने दिखाई दें।

escalated: |
  आपका सबमिशन टीम लीडर को भेज दिया गया है।
  संदर्भ: {session_id}
  वे जल्द संपर्क करेंगे।

parked: |
  आपका सेशन पार्क कर दिया गया है। दस्तावेज़ सुरक्षित हैं।
  संदर्भ: {session_id}
  सहायता के लिए अपने टीम लीडर से संपर्क करें।

error_unbound: |
  आपका नंबर Verigence में पंजीकृत नहीं है।
  कृपया अपने टीम लीडर से एक्सेस सेट करवाएं।

error_generic: |
  आपका संदेश प्रोसेस करने में समस्या आई।
  संदर्भ: {correlation_id}
  कृपया दोबारा प्रयास करें या टीम लीडर से संपर्क करें।
