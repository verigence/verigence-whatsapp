# Verigence WhatsApp — Punjabi copy

welcome: |
  Verigence Evidence Capture ਵਿੱਚ ਤੁਹਾਡਾ ਸੁਆਗਤ ਹੈ।
  ਕਿਰਪਾ ਕਰਕੇ ਆਪਣੇ ਡੀਲ ਦੇ ਦਸਤਾਵੇਜ਼ ਇੱਕ-ਇੱਕ ਕਰਕੇ ਭੇਜੋ।
  ਜੇ ਹੋ ਸਕੇ ਤਾਂ ਪਹਿਲਾਂ ਬੁਕਿੰਗ ਫਾਰਮ ਭੇਜੋ।

file_received: "ਮਿਲ ਗਿਆ। ਬਾਕੀ ਦਸਤਾਵੇਜ਼ ਭੇਜਦੇ ਰਹੋ — ਸਭ ਇਕੱਠੇ ਪ੍ਰੋਸੈਸ ਹੋਣਗੇ।"

debounce_flushing: "ਧੰਨਵਾਦ, ਤੁਹਾਡਾ ਸਬਮਿਸ਼ਨ ਪ੍ਰੋਸੈਸ ਹੋ ਰਿਹਾ ਹੈ..."

deal_confirm_header: "ਡੀਲ ਦੀ ਪੁਸ਼ਟੀ ਕਰੋ"
deal_confirm_body: |
  ਤੁਹਾਡੇ ਦਸਤਾਵੇਜ਼ਾਂ ਤੋਂ ਇਹ ਡੀਲ ਮਿਲੀ:
    ਬੁਕਿੰਗ: {booking_number}
    ਵਾਹਨ: {model}
    ਗਾਹਕ: {customer_name}
  ਕੀ ਇਹ ਸਹੀ ਹੈ?
deal_confirm_yes: "ਹਾਂ, ਪੁਸ਼ਟੀ ਕਰੋ"
deal_confirm_no: "ਨਹੀਂ, ਦੁਬਾਰਾ ਭੇਜੋ"

deal_confirmed: "ਡੀਲ ਦੀ ਪੁਸ਼ਟੀ ਹੋ ਗਈ। ਦਸਤਾਵੇਜ਼ ਜਾਂਚੇ ਜਾ ਰਹੇ ਹਨ..."

gaps_header: "ਸਬਮਿਸ਼ਨ ਸਾਰਾਂਸ਼"
gaps_complete: |
  ✅ ਬੁਕਿੰਗ {booking_number} ਲਈ ਸਾਰੇ ਜ਼ਰੂਰੀ ਦਸਤਾਵੇਜ਼ ਮਿਲ ਗਏ।
  ਤੁਹਾਡਾ ਸਬਮਿਸ਼ਨ ਮੁਕੰਮਲ ਹੋ ਗਿਆ।
gaps_missing: |
  ਪ੍ਰਾਪਤ ਦਸਤਾਵੇਜ਼:
  {received_list}

  ਅਜੇ ਚਾਹੀਦੇ:
  {missing_list}

  ਕਿਰਪਾ ਕਰਕੇ ਬਾਕੀ ਦਸਤਾਵੇਜ਼ ਜਲਦੀ ਭੇਜੋ।

retake_request: |
  ਇਹ ਦਸਤਾਵੇਜ਼ ਸਾਫ਼ ਨਹੀਂ ਸੀ, ਕਿਰਪਾ ਦੁਬਾਰਾ ਭੇਜੋ:
  • {doc_name}
  ਫ਼ੋਟੋ ਖਿੱਚਣ ਵੇਲੇ ਸਾਰੇ ਚਾਰੇ ਕੋਨੇ ਦਿਖਾਈ ਦੇਣ।

escalated: |
  ਤੁਹਾਡਾ ਸਬਮਿਸ਼ਨ ਟੀਮ ਲੀਡਰ ਨੂੰ ਭੇਜ ਦਿੱਤਾ ਗਿਆ ਹੈ।
  ਹਵਾਲਾ: {session_id}
  ਉਹ ਜਲਦੀ ਸੰਪਰਕ ਕਰਨਗੇ।

parked: |
  ਤੁਹਾਡਾ ਸੈਸ਼ਨ ਪਾਰਕ ਕਰ ਦਿੱਤਾ ਗਿਆ ਹੈ। ਦਸਤਾਵੇਜ਼ ਸੁਰੱਖਿਅਤ ਹਨ।
  ਹਵਾਲਾ: {session_id}
  ਸਹਾਇਤਾ ਲਈ ਆਪਣੇ ਟੀਮ ਲੀਡਰ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।

error_unbound: |
  ਤੁਹਾਡਾ ਨੰਬਰ Verigence ਵਿੱਚ ਰਜਿਸਟਰ ਨਹੀਂ ਹੈ।
  ਕਿਰਪਾ ਕਰਕੇ ਆਪਣੇ ਟੀਮ ਲੀਡਰ ਤੋਂ ਐਕਸੈਸ ਸੈੱਟ ਕਰਵਾਓ।

error_generic: |
  ਤੁਹਾਡਾ ਸੁਨੇਹਾ ਪ੍ਰੋਸੈਸ ਕਰਨ ਵਿੱਚ ਸਮੱਸਿਆ ਆਈ।
  ਹਵਾਲਾ: {correlation_id}
  ਕਿਰਪਾ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ ਜਾਂ ਟੀਮ ਲੀਡਰ ਨਾਲ ਸੰਪਰਕ ਕਰੋ।
